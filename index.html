---
layout: default
title: Blog
---
<section class="intro">
  <h1>Notes</h1>
  <p>{{ site.description }}</p>
</section>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      {% if post.excerpt %}<p>{{ post.excerpt | strip_html | truncate: 180 }}</p>{% endif %}
    </li>
  {% endfor %}
</ul>
